<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>

  <!-- Fonte fofa Playwrite Belgique Wallonie-Bruxelles Guides -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+BE+WAL+Guides&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho com título, laço CSS e subtítulo -->
  <header class="cabecalho">
    <!-- Laço decorativo feito só com CSS -->
    <div class="laco" aria-hidden="true">
      <span class="laco-esquerda"></span>
      <span class="laco-noh"></span>
      <span class="laco-direita"></span>
    </div>

    <h1>🐱 Boletim Digital 🎀</h1>
    <p class="subtitulo">9º Ano • Turma 9C • Chamada 23</p>
  </header>

  <main class="conteudo">

    <!-- ÁREA DE LOGIN POR PIN -->
    <section class="card-login" id="area-login">
      <h2>🔐 Acesso ao Boletim</h2>
      <p class="info-aluno">Turma: <strong>9C</strong> | Chamada: <strong>23</strong></p>
      
      <div class="form-pin">
        <label for="input-pin">Digite seu PIN:</label>
        <input type="password" id="input-pin" maxlength="10" placeholder="••••" autocomplete="off" />
        <button type="button" id="btn-entrar" class="btn-principal">Entrar</button>
      </div>
      
      <p id="msg-login" class="mensagem-status" aria-live="polite"></p>
    </section>

    <!-- PAINEL DO BOLETIM (OCULTO ATÉ O LOGIN) -->
    <div id="painel-boletim" style="display: none;">

      <!-- AÇÕES DE EDIÇÃO -->
      <div class="barra-acoes">
        <button type="button" id="btn-alterar" class="btn-secundario">Alterar dados</button>
        <button type="button" id="btn-salvar" class="btn-principal" style="display: none;">Salvar alterações</button>
        <button type="button" id="btn-cancelar" class="btn-cancelar" style="display: none;">Cancelar</button>
      </div>
      <p id="msg-edicao" class="mensagem-status" aria-live="polite"></p>

      <!-- Área dos cards de resumo (preenchida pelo JS) -->
      <section class="cards" id="cards"></section>

      <!-- Título da tabela -->
      <h2 class="titulo-tabela">📚 Notas por Disciplina</h2>

      <!-- Tabela responsiva -->
      <div class="tabela-container">
        <table class="tabela-boletim">
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>

    </div>

  </main>

  <!-- Rodapé fofo -->
  <footer class="rodape">
    <p>Feito com 💗 por Estudante Exemplo</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
